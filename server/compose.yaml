services:
  backend:
    image: altatherm-backend:v2-oven-dashboard
    container_name: altatherm-backend-test
    build: .

    network_mode: host

    env_file:
      - ./backend.env

    restart: unless-stopped

    command:
      - uvicorn
      - main:app
      - --host
      - "127.0.0.1"
      - --port
      - "8001"
